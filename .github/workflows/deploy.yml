name: Deploy to Cloudflare Pages

# Build the Astro site and publish to the Cloudflare Pages project
# `soyaos-website`. The workflow creates the Pages project when missing,
# deploys the production branch, and idempotently attaches the custom domains.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://soyaos.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Astro)
        run: bun run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          preCommands: wrangler pages project list --json | jq -e 'map(select(.name == "soyaos-website")) | length > 0' >/dev/null || bunx wrangler pages project create soyaos-website --production-branch main
          # `--branch=main` pins the Pages deployment to the production
          # branch so this run is treated as a production deployment
          # rather than a preview.
          command: pages deploy dist --project-name=soyaos-website --branch=main

      - name: Attach custom domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ensure_domain() {
            local domain="$1"
            local endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/soyaos-website/domains"
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${endpoint}" |
              jq -e --arg domain "${domain}" '.result | any(.name == $domain)' >/dev/null; then
              echo "${domain} is already attached"
              return
            fi
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$(jq -nc --arg name "${domain}" '{name: $name}')" \
              "${endpoint}" |
              jq -e '.success == true' >/dev/null
          }
          ensure_domain "soyaos.ai"
          ensure_domain "www.soyaos.ai"
