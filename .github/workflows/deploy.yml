name: Deploy to Cloudflare Pages

# Build the Astro site and publish to the Cloudflare Pages project
# `soyaos-website`. First push creates the Pages project; subsequent
# pushes produce a new deployment. Custom domains (apex `soyaos.ai`
# + `www.soyaos.ai` → 301 → apex) are managed out-of-band — see the
# Deploy section in README.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://soyaos.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Astro)
        run: bun run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` pins the Pages deployment to the production
          # branch so this run is treated as a production deployment
          # rather than a preview.
          command: pages deploy dist --project-name=soyaos-website --branch=main
